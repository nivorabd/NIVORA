<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora Universal AI Voice Studio - Full Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #07090e; color: #f3f4f6; }
        .gold-gradient { background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gold-border { border-color: #d4af37; }
        .gold-bg { background: linear-gradient(135deg, #d4af37, #aa771c); }
        .gold-bg:hover { background: linear-gradient(135deg, #f3e5ab, #c59b27); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col w-full">

    <!-- Top Navigation Bar -->
    <header class="bg-gray-950 border-b border-yellow-600/30 px-6 py-4 flex flex-wrap justify-between items-center sticky top-0 z-50 shadow-2xl">
        <div class="flex items-center space-x-3">
            <div class="w-11 h-11 rounded-2xl gold-bg flex items-center justify-center text-gray-950 font-bold text-2xl shadow-lg shadow-yellow-600/20">
                <i class="fa-solid fa-microphone-lines"></i>
            </div>
            <div>
                <h1 class="text-2xl font-extrabold gold-gradient">Nivora Voice Studio Pro</h1>
                <p class="text-xs text-gray-400">Powered by ElevenLabs AI Engine (Multi-Feature Suite)</p>
            </div>
        </div>

        <div class="flex items-center space-x-4 my-2 sm:my-0">
            <div class="bg-gray-900 border gold-border px-5 py-2 rounded-full flex items-center space-x-2 shadow-inner">
                <i class="fa-solid fa-coins text-yellow-400"></i>
                <span class="text-sm font-semibold">ক্রেডিট: <strong id="creditCount" class="text-yellow-400 text-base">15</strong></span>
            </div>
            <button onclick="watchAdForCredit()" class="gold-bg text-gray-950 font-bold px-5 py-2 rounded-full text-sm shadow-lg transition transform hover:scale-105 flex items-center space-x-2">
                <i class="fa-solid fa-play"></i>
                <span>অ্যাড দেখে ফ্রি ক্রেডিট নিন</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace - Full Screen Grid -->
    <main class="flex-1 w-full p-4 lg:p-6 grid grid-cols-1 xl:grid-cols-12 gap-6">
        
        <!-- Left Panel: Mode & Voice Selection (4 Cols) -->
        <div class="xl:col-span-4 bg-gray-900/90 border border-gray-800 rounded-3xl p-6 shadow-2xl space-y-6 flex flex-col justify-between backdrop-blur-md">
            <div class="space-y-6">
                <h2 class="text-xl font-bold text-yellow-400 border-b border-gray-800 pb-3 flex items-center">
                    <i class="fa-solid fa-sliders mr-3 text-yellow-500"></i> ১. স্টাইল ও ভয়েস প্রিসেট
                </h2>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">ক্যাটাগরি সিলেক্ট করুন</label>
                    <select id="audioCategory" class="w-full bg-gray-950 border border-gray-700 rounded-2xl p-3.5 text-sm focus:outline-none focus:border-yellow-500 text-gray-200">
                        <option value="qirat">🕌 ক্বেরাত তিলাওয়াত (Digital Reverb & Arabic Tone)</option>
                        <option value="islamic_song">🎵 ইসলামিক গজল ও নাশীদ (Melodic Chorus)</option>
                        <option value="maiking">📢 ডিজিটাল মাইকিং ও অ্যানাউন্সমেন্ট (High Volume)</option>
                        <option value="speech">🎙️ সাধারণ কথোপকথন / পডকাস্ট (HD Speech)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">ElevenLabs Voice ID (বা কাস্টম আইডি)</label>
                    <select id="voiceIdSelect" class="w-full bg-gray-950 border border-gray-700 rounded-2xl p-3.5 text-sm focus:outline-none focus:border-yellow-500 text-gray-200">
                        <option value="21m00Tcm4TlvDq8ikWAM">Rachel (Calm & Professional)</option>
                        <option value="AZnzlk1XvdvUeBnXmlld">Domi (Strong & Dynamic)</option>
                        <option value="EXAVITQu4vr4xnSDxMaL">Bella (Soft & Melodic)</option>
                        <option value="ErXwobaYiN019PkySvjV">Antoni (Deep Male Voice)</option>
                        <option value="MF3mGyEYCl7XYWbV9V6O">Elli (Emotional Narration)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">ভয়েস স্যাম্পল আপলোড (ক্লোনিংয়ের জন্য)</label>
                    <div class="border-2 border-dashed border-gray-700 rounded-2xl p-5 text-center hover:border-yellow-500 transition cursor-pointer bg-gray-950/50">
                        <input type="file" id="audioFile" accept="audio/*" class="hidden" onchange="handleFileSelect(event)">
                        <label for="audioFile" class="cursor-pointer">
                            <i class="fa-solid fa-cloud-arrow-up text-3xl text-yellow-500 mb-2"></i>
                            <p class="text-xs text-gray-300" id="fileNameDisplay">অডিও ফাইল ড্রপ বা ব্রাউজ করুন (MP3/WAV)</p>
                        </label>
                    </div>
                </div>
            </div>

            <div class="text-xs text-gray-500 text-center pt-4 border-t border-gray-800">
                ইলেভেনল্যাবস মাল্টিলিঙ্গুয়াল ভি-২ মডেল দ্বারা স্বয়ংক্রিয়ভাবে প্রসেস হয়।
            </div>
        </div>

        <!-- Middle Panel: Text Input & AI Settings (5 Cols) -->
        <div class="xl:col-span-5 bg-gray-900/90 border border-gray-800 rounded-3xl p-6 shadow-2xl space-y-6 flex flex-col justify-between backdrop-blur-md">
            <div class="space-y-6 flex-1 flex flex-col">
                <h2 class="text-xl font-bold text-yellow-400 border-b border-gray-800 pb-3 flex items-center">
                    <i class="fa-solid fa-pen-nib mr-3 text-yellow-500"></i> ২. টেক্সট ও এআই প্যারামিটার
                </h2>

                <div class="flex-1 flex flex-col">
                    <label class="block text-sm font-medium text-gray-300 mb-2">স্ক্রিপ্ট বা টেক্সট লিখুন (বাংলা, আরবি বা ইংরেজি)</label>
                    <textarea id="textInput" rows="6" class="w-full flex-1 bg-gray-950 border border-gray-700 rounded-2xl p-4 text-sm focus:outline-none focus:border-yellow-500 text-gray-100 resize-none custom-scrollbar" placeholder="এখানে আপনার ক্বেরাত, গজল, মাইকিংয়ের ঘোষণা বা সংলাপ লিখুন..."></textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">স্ট্যাবিলিটি (Stability)</label>
                        <input type="range" id="stabilityRange" min="0" max="1" step="0.05" value="0.75" class="w-full accent-yellow-500">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">ক্ল্যারিটি বুস্ট (Similarity)</label>
                        <input type="range" id="similarityRange" min="0" max="1" step="0.05" value="0.85" class="w-full accent-yellow-500">
                    </div>
                </div>
            </div>

            <button onclick="processElevenLabsVoice()" class="w-full gold-bg text-gray-950 font-extrabold py-4 rounded-2xl shadow-xl transition transform hover:scale-[1.01] flex items-center justify-center space-x-2 text-base">
                <i class="fa-solid fa-wand-magic-sparkles text-lg"></i>
                <span>এআই ভয়েস জেনারেট করুন (১ ক্রেডিট)</span>
            </button>
        </div>

        <!-- Right Panel: Output, Visualizer & Player (3 Cols) -->
        <div class="xl:col-span-3 bg-gray-900/90 border border-gray-800 rounded-3xl p-6 shadow-2xl flex flex-col justify-between backdrop-blur-md">
            <div class="space-y-6">
                <h2 class="text-xl font-bold text-yellow-400 border-b border-gray-800 pb-3 flex items-center">
                    <i class="fa-solid fa-waveform-lines mr-3 text-yellow-500"></i> ৩. ফাইনাল আউটপুট
                </h2>

                <div id="visualizer" class="bg-gray-950 border border-gray-800 rounded-2xl h-48 flex flex-col items-center justify-center p-6 text-center shadow-inner">
                    <div class="w-12 h-12 rounded-full bg-yellow-500/10 flex items-center justify-center text-yellow-400 mb-3 animate-pulse">
                        <i class="fa-solid fa-microphone text-xl"></i>
                    </div>
                    <p class="text-gray-400 text-sm" id="statusText">জেনারেট করার জন্য প্রস্তুত...</p>
                </div>
            </div>

            <div class="space-y-4 pt-4">
                <audio id="audioPlayer" controls class="w-full hidden rounded-xl"></audio>
                <a id="downloadBtn" href="#" download="nivora-ai-voice.mp3" class="hidden block w-full text-center bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-2xl shadow-lg transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-download"></i>
                    <span>হাই-কোয়ালিটি অডিও ডাউনলোড</span>
                </a>
            </div>
        </div>

    </main>

    <!-- Core JavaScript with Integrated API Key -->
    <script>
        // Pre-configured ElevenLabs API Key securely injected
        const ELEVEN_API_KEY = "sk_7cd8aa56553eaa21613a362bfcf1327e1b37c325a0f52dfa";
        let userCredits = 15;

        function updateCreditDisplay() {
            document.getElementById('creditCount').innerText = userCredits;
        }

        function watchAdForCredit() {
            alert("সফলভাবে ভিডিও অ্যাড দেখা সম্পন্ন হয়েছে! আপনার অ্যাকাউন্টে ১০টি ফ্রি ক্রেডিট যোগ করা হয়েছে।");
            userCredits += 10;
            updateCreditDisplay();
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if(file) {
                document.getElementById('fileNameDisplay').innerText = "ফাইল লোড হয়েছে: " + file.name;
            }
        }

        async function processElevenLabsVoice() {
            const textInput = document.getElementById('textInput').value.trim();
            const voiceId = document.getElementById('voiceIdSelect').value;
            const stability = document.getElementById('stabilityRange').value;
            const similarity = document.getElementById('similarityRange').value;
            const statusText = document.getElementById('statusText');

            if (!textInput) {
                alert("দয়া করে টেক্সট বক্সে কিছু লিখুন!");
                return;
            }

            if (userCredits <= 0) {
                alert("আপনার ক্রেডিট শেষ! দয়া করে 'অ্যাড দেখে ফ্রি ক্রেডিট নিন' বাটনে ক্লিক করুন।");
                return;
            }

            userCredits--;
            updateCreditDisplay();

            statusText.innerHTML = `
                <div class="flex flex-col items-center space-y-3">
                    <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-yellow-500"></div>
                    <p class="text-yellow-400 text-sm font-semibold">ElevenLabs এআই ইঞ্জিন প্রসেস করছে...</p>
                </div>
            `;

            try {
                const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
                    method: "POST",
                    headers: {
                        "Accept": "audio/mpeg",
                        "Content-Type": "application/json",
                        "xi-api-key": ELEVEN_API_KEY
                    },
                    body: JSON.stringify({
                        "text": textInput,
                        "model_id": "eleven_multilingual_v2",
                        "voice_settings": {
                            "stability": parseFloat(stability),
                            "similarity_boost": parseFloat(similarity)
                        }
                    })
                });

                if (response.ok) {
                    const audioBlob = await response.blob();
                    const audioUrl = URL.createObjectURL(audioBlob);
                    
                    const player = document.getElementById('audioPlayer');
                    player.src = audioUrl;
                    player.classList.remove('hidden');
                    
                    statusText.innerHTML = `
                        <div class="text-emerald-400 font-bold flex items-center space-x-2">
                            <i class="fa-solid fa-circle-check text-xl"></i>
                            <span>ভয়েস সফলভাবে জেনারেট হয়েছে!</span>
                        </div>
                    `;
                    
                    const downloadBtn = document.getElementById('downloadBtn');
                    downloadBtn.href = audioUrl;
                    downloadBtn.classList.remove('hidden');
                } else {
                    const errData = await response.json();
                    statusText.innerHTML = `<span class="text-red-400 text-xs">এআই এরর: ${errData.detail?.message || "অনুমোদন ত্রুটি!"}</span>`;
                }
            } catch (error) {
                statusText.innerHTML = `<span class="text-red-400 text-xs">নেটওয়ার্ক বা সার্ভার কানেকশন সমস্যা!</span>`;
            }
        }
    </script>
</body>
</html>
