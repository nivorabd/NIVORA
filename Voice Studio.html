<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora Voice & AI Clone Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        .gold-gradient { background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gold-border { border-color: #d4af37; }
        .gold-bg { background: linear-gradient(135deg, #d4af37, #aa771c); }
        .gold-bg:hover { background: linear-gradient(135deg, #f3e5ab, #c59b27); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Top Navigation -->
    <header class="bg-gray-900 border-b border-yellow-600/30 px-6 py-4 flex flex-wrap justify-between items-center sticky top-0 z-50 gap-4">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full gold-bg flex items-center justify-center text-gray-900 font-bold text-xl shadow-lg">
                <i class="fa-solid fa-microphone-lines"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold gold-gradient">Nivora Voice Studio</h1>
                <p class="text-xs text-gray-400">ElevenLabs AI Voice Clone Suite</p>
            </div>
        </div>

        <!-- API Key Input Box (এখানে আপনার ElevenLabs API Key বসাবেন) -->
        <div class="flex items-center space-x-2 bg-gray-800 p-1.5 rounded-xl border border-yellow-600/40">
            <i class="fa-solid fa-key text-yellow-400 px-2"></i>
            <input type="password" id="apiKeyInput" placeholder="ElevenLabs API Key এখানে বসান..." class="bg-transparent text-sm text-white focus:outline-none w-48 sm:w-64">
        </div>

        <div class="flex items-center space-x-4">
            <div class="bg-gray-800 border gold-border px-4 py-1.5 rounded-full flex items-center space-x-2">
                <i class="fa-solid fa-coins text-yellow-400"></i>
                <span class="text-sm">ক্রেডিট: <strong id="creditCount" class="text-yellow-400">10</strong></span>
            </div>
            <button onclick="watchAdForCredit()" class="gold-bg text-gray-900 font-semibold px-4 py-1.5 rounded-full text-sm shadow transition transform hover:scale-105">
                <i class="fa-solid fa-play"></i> ফ্রি ক্রেডিট নিন
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Left Panel: Mode & Upload -->
        <div class="bg-gray-900/80 border border-gray-800 rounded-2xl p-6 shadow-xl space-y-6">
            <h2 class="text-lg font-bold text-yellow-500 border-b border-gray-800 pb-3">
                <i class="fa-solid fa-sliders mr-2"></i> ১. মোড ও ভয়েস সোর্স
            </h2>

            <div>
                <label class="block text-sm text-gray-400 mb-2">অডিও ক্যাটাগরি / স্টাইল</label>
                <select id="audioMode" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-sm focus:outline-none focus:border-yellow-500">
                    <option value="qirat">ক্বেরাত তিলাওয়াত (Digital Reverb)</option>
                    <option value="islamic_song">ইসলামিক গজল ও গান</option>
                    <option value="maiking">ডিজিটাল মাইকিং ও অ্যানাউন্সমেন্ট</option>
                    <option value="normal_speech">সাধারণ কথোপকথন (Speech Clone)</option>
                </select>
            </div>

            <div>
                <label class="block text-sm text-gray-400 mb-2">ভয়েস স্যাম্পল আপলোড (বা রেকর্ড করুন)</label>
                <div class="border-2 border-dashed border-gray-700 rounded-xl p-4 text-center hover:border-yellow-500 transition cursor-pointer">
                    <input type="file" id="audioFile" accept="audio/*" class="hidden" onchange="handleFileSelect(event)">
                    <label for="audioFile" class="cursor-pointer">
                        <i class="fa-solid fa-cloud-arrow-up text-3xl text-yellow-500 mb-2"></i>
                        <p class="text-sm text-gray-300" id="fileNameDisplay">ভয়েস স্যাম্পল ফাইল ড্রপ বা ব্রাউজ করুন</p>
                    </label>
                </div>
            </div>

            <div>
                <label class="block text-sm text-gray-400 mb-2">টেক্সট ইনপুট (Text-to-Voice)</label>
                <textarea id="textInput" rows="4" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-sm focus:outline-none focus:border-yellow-500" placeholder="এখানে আপনার টেক্সট লিখুন যা ভয়েসে রূপান্তরিত হবে..."></textarea>
            </div>
        </div>

        <!-- Middle Panel: AI Enhancer & FX -->
        <div class="bg-gray-900/80 border border-gray-800 rounded-2xl p-6 shadow-xl space-y-6">
            <h2 class="text-lg font-bold text-yellow-500 border-b border-gray-800 pb-3">
                <i class="fa-solid fa-wand-magic-sparkles mr-2"></i> ২. এআই এনহ্যান্স ও প্রসেসিং
            </h2>

            <div class="space-y-4">
                <div class="flex items-center justify-between bg-gray-800/50 p-3 rounded-xl border border-gray-700/50">
                    <span class="text-sm">নয়েজ রিডাকশন (Noise Suppression)</span>
                    <input type="checkbox" id="fxNoise" checked class="w-5 h-5 accent-yellow-500">
                </div>
                <div class="flex items-center justify-between bg-gray-800/50 p-3 rounded-xl border border-gray-700/50">
                    <span class="text-sm">স্টুডিও রিভার্ব ও ইকো (Digital Reverb)</span>
                    <input type="checkbox" id="fxReverb" checked class="w-5 h-5 accent-yellow-500">
                </div>
            </div>

            <div>
                <label class="block text-sm text-gray-400 mb-2">ElevenLabs Voice ID (ঐচ্ছিক)</label>
                <input type="text" id="voiceIdInput" value="21m00Tcm4TlvDq8ikWAM" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-sm focus:outline-none focus:border-yellow-500" placeholder="Voice ID দিন...">
            </div>

            <button onclick="processRealVoiceClone()" class="w-full gold-bg text-gray-900 font-bold py-3.5 rounded-xl shadow-lg transition transform hover:scale-[1.02]">
                <i class="fa-solid fa-bolt mr-2"></i> এআই ভয়েস জেনারেট করুন (১ ক্রেডিট)
            </button>
        </div>

        <!-- Right Panel: Output & Visualizer -->
        <div class="bg-gray-900/80 border border-gray-800 rounded-2xl p-6 shadow-xl flex flex-col justify-between">
            <div>
                <h2 class="text-lg font-bold text-yellow-500 border-b border-gray-800 pb-3 mb-4">
                    <i class="fa-solid fa-waveform-lines mr-2"></i> ৩. ফাইনাল আউটপুট
                </h2>

                <div id="visualizer" class="bg-gray-950 border border-gray-800 rounded-xl h-40 flex items-center justify-center p-4 mb-4 text-center">
                    <div class="text-gray-500 text-sm" id="statusText">প্রসেসিংয়ের জন্য অপেক্ষা করছে...</div>
                </div>
            </div>

            <div class="space-y-3">
                <audio id="audioPlayer" controls class="w-full hidden"></audio>
                <a id="downloadBtn" href="#" download="nivora-ai-voice.mp3" class="hidden block w-full text-center bg-green-600 hover:bg-green-500 text-white font-semibold py-3 rounded-xl transition">
                    <i class="fa-solid fa-download mr-2"></i> ডাউনলোড করুন
                </a>
            </div>
        </div>

    </main>

    <script>
        let credits = 10;

        function updateCreditDisplay() {
            document.getElementById('creditCount').innerText = credits;
        }

        function watchAdForCredit() {
            alert("সফলভাবে অ্যাড দেখা সম্পন্ন হয়েছে! ৫টি ফ্রি ক্রেডিট যোগ করা হয়েছে।");
            credits += 5;
            updateCreditDisplay();
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if(file) {
                document.getElementById('fileNameDisplay').innerText = "ফাইল: " + file.name;
            }
        }

        async function processRealVoiceClone() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const textInput = document.getElementById('textInput').value.trim();
            const voiceId = document.getElementById('voiceIdInput').value.trim() || "21m00Tcm4TlvDq8ikWAM";
            const statusText = document.getElementById('statusText');

            if (!apiKey) {
                alert("দয়া করে ওপরের বক্সে আপনার ElevenLabs API Key দিন!");
                return;
            }
            if (!textInput) {
                alert("দয়া করে কিছু টেক্সট লিখুন যা ভয়েসে রূপান্তরিত হবে!");
                return;
            }

            if (credits <= 0) {
                alert("আপনার পর্যাপ্ত ক্রেডিট নেই! অ্যাড দেখে ক্রেডিট নিন।");
                return;
            }

            credits--;
            updateCreditDisplay();

            statusText.innerHTML = `<div class="flex flex-col items-center space-y-2"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-yellow-500"></div><p class="text-yellow-400 text-sm">ElevenLabs এআই এর মাধ্যমে ভয়েস প্রসেস হচ্ছে...</p></div>`;

            try {
                const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
                    method: "POST",
                    headers: {
                        "Accept": "audio/mpeg",
                        "Content-Type": "application/json",
                        "xi-api-key": apiKey
                    },
                    body: JSON.stringify({
                        "text": textInput,
                        "model_id": "eleven_multilingual_v2",
                        "voice_settings": {
                            "stability": 0.5,
                            "similarity_boost": 0.75
                        }
                    })
                });

                if (response.ok) {
                    const audioBlob = await response.blob();
                    const audioUrl = URL.createObjectURL(audioBlob);
                    const player = document.getElementById('audioPlayer');
                    player.src = audioUrl;
                    player.classList.remove('hidden');
                    statusText.innerText = "ভয়েস জেনারেশন সফল!";
                    document.getElementById('downloadBtn').classList.remove('hidden');
                } else {
                    const errData = await response.json();
                    statusText.innerText = "এআই এরর: " + (errData.detail?.message || "ইনভ্যালিড এপিআই কি!");
                }
            } catch (error) {
                statusText.innerText = "নেটওয়ার্ক বা এপিআই কানেকশন ত্রুটি!";
            }
        }
    </script>
</body>
</html>
