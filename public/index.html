
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020617">
  <meta name="description" content="NIVORA ONE — AI, Business Management, Marketplace and Digital Services">
  <title>NIVORA ONE — Enterprise Ecosystem</title>

  <!-- External UI libraries -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      background: #020617;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, "Segoe UI",
                   "Noto Sans Bengali", sans-serif;
    }

    button, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, select:focus-visible {
      outline: 2px solid #34d399;
      outline-offset: 3px;
    }

    #appFrame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #020617;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #020617; }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 8px;
    }

    .feature-btn {
      flex-shrink: 0;
      white-space: nowrap;
      border: 1px solid #1e293b;
      background: #0f172a;
      color: #cbd5e1;
      transition: background .2s, color .2s;
    }

    .feature-btn:hover { background: #1e293b; }

    .feature-btn.is-active {
      background: #059669;
      border-color: #10b981;
      color: white;
    }

    #left-drawer {
      padding-bottom: max(16px, env(safe-area-inset-bottom));
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      z-index: 100;
      max-width: calc(100vw - 32px);
      padding: 11px 16px;
      border: 1px solid #334155;
      border-radius: 12px;
      background: #0f172a;
      color: #f8fafc;
      font-size: 13px;
      box-shadow: 0 10px 35px #0008;
      overflow-wrap: anywhere;
    }

    #toast[hidden] { display: none; }

    #frame-status {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #020617;
      text-align: center;
    }

    #frame-status[hidden] { display: none; }

    .status-card {
      width: min(100%, 420px);
      padding: 24px;
      border: 1px solid #1e293b;
      border-radius: 18px;
      background: #0f172a;
    }

    .status-card button {
      margin-top: 14px;
      padding: 9px 14px;
      border-radius: 10px;
      background: #059669;
      color: white;
    }

    @media (max-width: 480px) {
      .brand-subtitle { display: none; }
      .auth-label { display: none; }
      #live-clock { max-width: 47vw; }
      #clock-text { overflow: hidden; text-overflow: ellipsis; }
    }
  </style>
</head>

<body class="h-screen flex flex-col overflow-hidden">

  <!-- 7. APPLICATION LOGIC -->
  <script>
    (() => {
      "use strict";

      const $ = (selector) => document.querySelector(selector);

      const frame = $("#appFrame");
      const status = $("#frame-status");
      const statusIcon = $("#status-icon");
      const statusTitle = $("#status-title");
      const statusMessage = $("#status-message");
      const drawer = $("#left-drawer");
      const backdrop = $("#drawer-backdrop");
      const toast = $("#toast");

      let currentPage = "./pages/ai-studio.html";
      let loadTimer = null;
      let toastTimer = null;
      let requestNumber = 0;

      const allowedPages = new Set([
        "pages/ai-studio.html",
        "pages/business.html",
        "pages/ecommerce.html",
        "pages/calculator.html",
        "pages/homoeo-hall.html",
        "pages/admin-panel.html",
        "pages/core-hub.html",
        "pages/radar-tracking.html",
        "pages/reviews.html",
        "pages/about-security.html"
      ]);

      /* Toast notification */
      function showToast(message) {
        toast.textContent = message;
        toast.hidden = false;

        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.hidden = true;
        }, 3500);
      }

      /* Live Bangladesh clock */
      function updateClock() {
        const now = new Date();

        try {
          $("#clock-text").textContent =
            now.toLocaleString("bn-BD", {
              timeZone: "Asia/Dhaka",
              weekday: "short",
              day: "numeric",
              month: "short",
              year: "numeric",
              hour: "2-digit",
              minute: "2-digit",
              second: "2-digit",
              hour12: true
            });
        } catch (error) {
          $("#clock-text").textContent = now.toLocaleString();
        }
      }

      updateClock();
      setInterval(updateClock, 1000);

      /* Sidebar open / close */
      function openDrawer() {
        drawer.classList.remove("-translate-x-full");
        backdrop.classList.remove("hidden");
        drawer.setAttribute("aria-hidden", "false");
        $("#drawer-open").setAttribute("aria-expanded", "true");
      }

      function closeDrawer() {
        drawer.classList.add("-translate-x-full");
        backdrop.classList.add("hidden");
        drawer.setAttribute("aria-hidden", "true");
        $("#drawer-open").setAttribute("aria-expanded", "false");
      }

      $("#drawer-open").addEventListener("click", openDrawer);
      $("#drawer-close").addEventListener("click", closeDrawer);
      backdrop.addEventListener("click", closeDrawer);

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeDrawer();
      });

      /* Update active menu across both navigation areas */
      function updateActiveMenu(page) {
        const normalized = page.replace(/^\.?\//, "");

        document.querySelectorAll("[data-page]").forEach((button) => {
          const buttonPage = button.dataset.page;

          const isActive = buttonPage === normalized;

          if (button.classList.contains("feature-btn")) {
            button.classList.toggle("is-active", isActive);
          }

          if (button.classList.contains("drawer-link")) {
            button.classList.toggle("is-active", isActive);
          }
        });
      }

      /* Workspace loading status */
      function showLoading(page) {
        status.hidden = false;
        statusIcon.className =
          "fa-solid fa-circle-notch fa-spin text-3xl text-emerald-400";
        statusTitle.textContent = "পেজ লোড হচ্ছে";
        statusMessage.textContent =
          page + " — অনুগ্রহ করে অপেক্ষা করুন।";
        $("#retry-page").hidden = true;
      }

      function showLoadError(page) {
        status.hidden = false;
        statusIcon.className =
          "fa-solid fa-triangle-exclamation text-3xl text-amber-400";
        statusTitle.textContent = "পেজটি লোড করা যায়নি";
        statusMessage.textContent =
          "ফাইলের নাম, ফোল্ডার ও GitHub Deployment পরীক্ষা করুন: " + page;
        $("#retry-page").hidden = false;
      }

      function loadFeature(filePath) {
        const page = String(filePath || "").replace(/^\.?\//, "");

        if (!allowedPages.has(page)) {
          showToast("এই পেজের অনুমোদিত পথ পাওয়া যায়নি।");
          return;
        }

        currentPage = "./" + page;
        const thisRequest = ++requestNumber;

        clearTimeout(loadTimer);
        closeDrawer();
        updateActiveMenu(page);
        showLoading(page);

        /*
          A timeout is only a warning.
          A slow connection can also take longer than 15 seconds.
        */
        loadTimer = setTimeout(() => {
          if (thisRequest === requestNumber) {
            statusTitle.textContent = "পেজ লোড হতে দেরি হচ্ছে";
            statusMessage.textContent =
              "ইন্টারনেট সংযোগ ও ফাইলের অবস্থান পরীক্ষা করুন।";
            $("#retry-page").hidden = false;
          }
        }, 15000);

        frame.src = currentPage;
      }

      /*
        A missing HTML file may still trigger iframe load.
        Inspect only same-origin documents and report likely 404 pages.
      */
      frame.addEventListener("load", () => {
        clearTimeout(loadTimer);

        let missing = false;

        try {
          const doc = frame.contentDocument;
          const pageUrl = frame.contentWindow.location.pathname;
          const bodyText = (doc?.body?.innerText || "")
            .slice(0, 1200)
            .toLowerCase();
          const title = (doc?.title || "").toLowerCase();

          missing =
            /\/404\/?$/.test(pageUrl) ||
            (
              /404|not found|page not found/.test(title) &&
              /404|not found|page not found/.test(bodyText)
            );
        } catch (error) {
          /*
            If the document cannot be inspected, do not claim
            that it failed. Browser security may block inspection.
          */
        }

        if (missing) {
          showLoadError(currentPage);
          return;
        }

        status.hidden = true;
      });

      frame.addEventListener("error", () => {
        clearTimeout(loadTimer);
        showLoadError(currentPage);
      });

      $("#retry-page").addEventListener("click", () => {
        loadFeature(currentPage);
      });

      /* One handler for every navigation button */
      document.querySelectorAll("[data-page]").forEach((button) => {
        button.addEventListener("click", () => {
          loadFeature(button.dataset.page);
        });
      });

      /* Language and currency preferences */
      $("#language-select").addEventListener("change", (event) => {
        const language = event.target.value;

        try {
          localStorage.setItem("nivora_language", language);
        } catch (error) {}

        showToast(
          language === "bn" ? "বাংলা ভাষা নির্বাচন করা হয়েছে।" :
          language === "de" ? "Deutsch ausgewählt." :
          "English selected."
        );

        /*
          This saves the preference only.
          It does not automatically translate every module.
        */
      });

      $("#currency-select").addEventListener("change", (event) => {
        const currency = event.target.value;

        try {
          localStorage.setItem("nivora_currency", currency);
        } catch (error) {}

        showToast(
          "নির্বাচিত মুদ্রা: " + currency +
          "। এটি এখনো সব মডিউলের হিসাব পরিবর্তন করে না।"
        );
      });

      /* Demo-session logout only; does not sign out Firebase */
      $("#logout-btn").addEventListener("click", () => {
        const confirmed = window.confirm(
          "আপনি কি ডেমো সেশন থেকে লগআউট করতে চান?"
        );

        if (!confirmed) return;

        try {
          localStorage.removeItem("nivora_demo_session");
        } catch (error) {}

        closeDrawer();
        showToast(
          "ডেমো সেশন পরিষ্কার করা হয়েছে। Firebase লগআউট আলাদাভাবে যুক্ত করতে হবে।"
        );
      });

      /* Restore saved preferences */
      try {
        const savedLanguage = localStorage.getItem("nivora_language");
        const savedCurrency = localStorage.getItem("nivora_currency");

        if (["bn", "en", "de"].includes(savedLanguage)) {
          $("#language-select").value = savedLanguage;
        }

        if (["BDT", "USD", "EUR"].includes(savedCurrency)) {
          $("#currency-select").value = savedCurrency;
        }
      } catch (error) {}

      /* Initial workspace */
      updateActiveMenu("pages/ai-studio.html");

      /*
        Keep a normal iframe fallback if JavaScript is interrupted.
        The initial iframe source is already set in the HTML.
      */
    })();
  </script>

  <!-- Load only if this file exists in your repository -->
  <script type="module" src="./js/firebase.js"></script>

</body>
</html>
