  <script>
    /* NIVORA CORE & CONFIG */
    const NIVORA_CONFIG = {
      appName: "NIVORA ONE",
      currentCountry: localStorage.getItem('nivora_country') || 'BD',
      smartLink: "https://www.profitableratecpmnetwork.com/p6imect7r8?key=692ccf2f3dfc2ee640e7e096158b3f275",
      homoeoPhone: "+8801700000000",
      setCountry(code) {
        this.currentCountry = code;
        localStorage.setItem('nivora_country', code);
        const c = NIVORA_COUNTRIES[code];
        if (c) {
          NIVORA_I18N.setLanguage(c.defaultLang);
          NIVORA_CORE.toast(`${c.name} (${c.currency}) নির্বাচিত হয়েছে`, 'info');
        }
        NIVORA_NAV.renderCurrent();
      }
    };

    const NIVORA_COUNTRIES = {
      BD: { code: 'BD', name: 'বাংলাদেশ', currency: 'BDT', symbol: '৳', defaultLang: 'bn' },
      IN: { code: 'IN', name: 'ভারত', currency: 'INR', symbol: '₹', defaultLang: 'hi' },
      PK: { code: 'PK', name: 'পাকিস্তান', currency: 'PKR', symbol: '₨', defaultLang: 'ur' },
      NP: { code: 'NP', name: 'নেপাল', currency: 'NPR', symbol: 'रू', defaultLang: 'en' },
      LK: { code: 'LK', name: 'শ্রীলঙ্কা', currency: 'LKR', symbol: 'රු', defaultLang: 'en' },
      BT: { code: 'BT', name: 'ভুটান', currency: 'BTN', symbol: 'Nu.', defaultLang: 'en' },
      MV: { code: 'MV', name: 'মালদ্বীপ', currency: 'MVR', symbol: 'Rf', defaultLang: 'en' },
      AF: { code: 'AF', name: 'আফগানিস্তান', currency: 'AFN', symbol: '؋', defaultLang: 'ur' }
    };

    const NIVORA_CURRENCY = {
      format(amount) {
        const c = NIVORA_COUNTRIES[NIVORA_CONFIG.currentCountry] || NIVORA_COUNTRIES.BD;
        return `${c.symbol} ${Number(amount || 0).toLocaleString('en-US')}`;
      }
    };

    const NIVORA_STORAGE = {
      get(key, fallback) {
        try {
          const item = localStorage.getItem('nivora_' + key);
          return item ? JSON.parse(item) : fallback;
        } catch { return fallback; }
      },
      set(key, val) {
        try { localStorage.setItem('nivora_' + key, JSON.stringify(val)); } catch {}
      }
    };

    const NIVORA_CORE = {
      toast(msg, type = 'info') {
        const box = document.getElementById('toast-container');
        if (!box) return;
        const el = document.createElement('div');
        const color = type === 'success' ? 'bg-emerald-950/95 border-emerald-500 text-emerald-200' :
                      type === 'error' ? 'bg-rose-950/95 border-rose-500 text-rose-200' :
                      type === 'warning' ? 'bg-amber-950/95 border-amber-500 text-amber-200' : 'bg-slate-900/95 border-blue-500 text-blue-200';
        el.className = `p-3 rounded-xl shadow-2xl text-xs font-semibold flex items-center justify-between gap-2 border pointer-events-auto animate-fade-in ${color}`;
        el.innerHTML = `<span>${msg}</span><button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-white">✕</button>`;
        box.appendChild(el);
        setTimeout(() => el.remove(), 3200);
      },
      confirm(msg, title = 'নিশ্চিতকরণ') {
        return new Promise((resolve) => {
          const d = document.getElementById('global-dialog');
          document.getElementById('dialog-title').textContent = title;
          document.getElementById('dialog-message').textContent = msg;
          document.getElementById('dialog-cancel-btn').style.display = 'block';
          d.classList.remove('hidden'); d.classList.add('flex');
          document.getElementById('dialog-confirm-btn').onclick = () => { d.classList.add('hidden'); d.classList.remove('flex'); resolve(true); };
          document.getElementById('dialog-cancel-btn').onclick = () => { d.classList.add('hidden'); d.classList.remove('flex'); resolve(false); };
        });
      },
      alert(msg, title = 'NIVORA ONE') {
        return new Promise((resolve) => {
          const d = document.getElementById('global-dialog');
          document.getElementById('dialog-title').textContent = title;
          document.getElementById('dialog-message').textContent = msg;
          document.getElementById('dialog-cancel-btn').style.display = 'none';
          d.classList.remove('hidden'); d.classList.add('flex');
          document.getElementById('dialog-confirm-btn').onclick = () => { d.classList.add('hidden'); d.classList.remove('flex'); resolve(); };
        });
      }
    };

    const NIVORA_I18N = {
      lang: localStorage.getItem('nivora_lang') || 'bn',
      setLanguage(l) {
        if (['bn', 'en', 'hi', 'ur'].includes(l)) {
          this.lang = l;
          localStorage.setItem('nivora_lang', l);
          document.documentElement.lang = l;
          document.documentElement.dir = l === 'ur' ? 'rtl' : 'ltr';
          const sel = document.getElementById('lang-select');
          if (sel) sel.value = l;
          NIVORA_NAV.renderCurrent();
        }
      }
    };

    const firebaseConfig = {
      apiKey: "AIzaSyDdNE98coyO93LFex4faeIUKnraQEXMYhE",
      authDomain: "nivora-8b0fc.firebaseapp.com",
      projectId: "nivora-8b0fc",
      storageBucket: "nivora-8b0fc.firebasestorage.app",
      messagingSenderId: "109067195329",
      appId: "1:109067195329:web:1e0e5af8f9824d00be1540",
      measurementId: "G-ZQG22V61RP"
    };
    try {
      if (typeof firebase !== 'undefined') firebase.initializeApp(firebaseConfig);
    } catch (e) {}

    /* ROUTER */
    const NIVORA_NAV = {
      current: 'home',
      stack: ['home'],
      goTo(mod) {
        if (this.current !== mod) {
          this.stack.push(mod);
          this.current = mod;
          window.history.pushState({ mod }, '', '');
        }
        this.renderCurrent();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      },
      goBack() {
        if (this.stack.length > 1) {
          this.stack.pop();
          this.current = this.stack[this.stack.length - 1];
          this.renderCurrent();
        } else {
          this.goTo('home');
        }
      },
      renderCurrent() {
        const backBtn = document.getElementById('btn-back');
        if (backBtn) {
          if (this.current === 'home') backBtn.classList.add('hidden');
          else backBtn.classList.remove('hidden');
        }

        ['home', 'quran', 'ai', 'business', 'market'].forEach(m => {
          const btn = document.getElementById('nav-btn-' + m);
          if (btn) {
            btn.className = this.current === m
              ? "py-2 rounded-xl flex flex-col items-center gap-1 font-medium text-blue-400 font-bold touch-press"
              : "py-2 rounded-xl flex flex-col items-center gap-1 font-medium text-slate-400 hover:text-slate-200 touch-press";
          }
        });

        const v = document.getElementById('app-viewport');
        if (!v) return;

        if (this.current === 'home') v.innerHTML = renderHomeView();
        else if (this.current === 'quran') v.innerHTML = renderQuranView();
        else if (this.current === 'ai') v.innerHTML = renderAIView();
        else if (this.current === 'business') v.innerHTML = renderBusinessView();
        else if (this.current === 'ledger') v.innerHTML = renderLedgerView();
        else if (this.current === 'stock') v.innerHTML = renderStockView();
        else if (this.current === 'radar') v.innerHTML = renderRadarView();
        else if (this.current === 'market') v.innerHTML = renderMarketView();

    /* =========================================================
       NIVORA QURAN HUB — REAL READER
       604 Mushaf pages + 15-line Mushaf image + 4 meanings
       + Abdul Wali Al-Arkani recitation + local caching
       ========================================================= */

    let activeQuranSurah = null;
    let audioInst = null;
    let quranPage = Number(localStorage.getItem('nivora_quran_page') || '1');
    let quranMeaningLang = localStorage.getItem('nivora_quran_lang') || 'bn';
    let quranPageData = null;

    const QURAN_API = 'https://api.alquran.cloud/v1';
    const QURAN_MUSHAF = 'https://api.islamic.app/v1/mushaf/page';
    const QURAN_LANGS = {
      bn: { label: 'বাংলা', edition: 'bn.bengali' },
      en: { label: 'English', edition: 'en.sahih' },
      hi: { label: 'हिन्दी', edition: 'hi.hindi' },
      ur: { label: 'اردو', edition: 'ur.jalandhry' }
    };

    function quranEsc(value){
      return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function quranPageCacheKey(page, lang){
      return `nivora_quran_cache_${page}_${lang}`;
    }

    function quranSaveCache(page, lang, data){
      try{
        localStorage.setItem(quranPageCacheKey(page, lang), JSON.stringify({time:Date.now(),data}));
      }catch(e){}
    }

    function quranReadCache(page, lang){
      try{
        const x=JSON.parse(localStorage.getItem(quranPageCacheKey(page,lang))||'null');
        return x && x.data ? x.data : null;
      }catch(e){return null;}
    }

    async function quranFetchPageEdition(page, edition){
      const langKey=Object.keys(QURAN_LANGS).find(k=>QURAN_LANGS[k].edition===edition);
      if(langKey){
        const cached=quranReadCache(page,langKey);
        if(cached) return cached;
      }
      const res=await fetch(`${QURAN_API}/page/${page}/${encodeURIComponent(edition)}`);
      if(!res.ok) throw new Error('Quran API error');
      const json=await res.json();
      if(!json || !json.data) throw new Error('Empty Quran data');
      if(langKey) quranSaveCache(page,langKey,json.data);
      return json.data;
    }

    async function quranLoadMeanings(page){
      const lang=QURAN_LANGS[quranMeaningLang]||QURAN_LANGS.bn;
      const box=document.getElementById('nvQuranMeaningBody');
      if(!box) return;
      box.innerHTML='<div class="text-xs text-slate-400">অর্থ লোড হচ্ছে...</div>';
      try{
        const data=await quranFetchPageEdition(page,lang.edition);
        const ayahs=data.ayahs||[];
        box.innerHTML=ayahs.map(a=>`

}

------------------------------------------------------------ */

async function sendAI() {

  if (aiBusy) return;

  const input =
    document.getElementById(
      'ai-input'
    );

  const value =
    input?.value?.trim();

  if (!value) return;


  /* --------------------------------------------------------
     USER MESSAGE
  -------------------------------------------------------- */

  aiChat.push({
    role: 'user',
    text: value
  });

  saveAIChat();


  /* --------------------------------------------------------
     Busy state
  -------------------------------------------------------- */

  aiBusy = true;

  NIVORA_NAV.renderCurrent();


  try {

    /*
     Backend-এ পাঠানোর জন্য conversation format তৈরি।
    বর্তমান AI provider manager content গ্রহণ করে।
    */

    const conversation =
      aiChat
        .slice(-20)
        .map(item => ({

          role:
            item.role === 'assistant'
              ? 'assistant'
              : 'user',

          content:
            String(
              item.text || ''
            )

        }))
        .filter(
          item =>
            item.content.trim()
        );


    /* ------------------------------------------------------
       REAL BACKEND CALL
       /api/ai
    ------------------------------------------------------ */

    const response =
      await fetch(
        '/api/ai',
        {

          method: 'POST',

          headers: {
            'Content-Type':
              'application/json'
          },

          body:
            JSON.stringify({

              message: value,

              provider: 'auto',

              model: 'auto',

              conversation:

                conversation.slice(
                  0,
                  -1
                ),

              app: 'NIVORA ONE',

              mode: 'studio-agent'

            })

        }
      );


    /* ------------------------------------------------------
       READ RESPONSE
    ------------------------------------------------------ */

    let data = null;

    try {

      data =
        await response.json();

    } catch (jsonError) {

      throw new Error(
        'AI server থেকে সঠিক response পাওয়া যায়নি।'
      );
    }


    /* ------------------------------------------------------
       BACKEND ERROR
    ------------------------------------------------------ */

    if (
      !response.ok ||
      !data?.success
    ) {

      throw new Error(
        data?.error ||
        `AI server error (${response.status})`
      );
    }


    /* ------------------------------------------------------
       AI ANSWER
    ------------------------------------------------------ */

    const answer =
      String(
        data?.answer || ''
      ).trim();


    if (!answer) {

      throw new Error(
        'NIVORA AI কোনো উত্তর দেয়নি।'
      );
    }


    /* ------------------------------------------------------
       SAVE AI ANSWER
    ------------------------------------------------------ */

    aiChat.push({

      role: 'assistant',

      text: answer

    });

    saveAIChat();


    /* ------------------------------------------------------
       Optional provider information
    ------------------------------------------------------ */

    if (
      data?.provider
    ) {

      console.log(
        'NIVORA AI Provider:',
        data.provider
      );

    }

    if (
      data?.model
    ) {

      console.log(
        'NIVORA AI Model:',
        data.model
      );

    }

  } catch (error) {

    console.error(
      'NIVORA AI ERROR:',
      error
    );


    /* ------------------------------------------------------
       Show real error to user
    ------------------------------------------------------ */

    aiChat.push({

      role: 'assistant',

      text:
        'দুঃখিত, এই মুহূর্তে NIVORA AI সার্ভারের সঙ্গে সংযোগ করা যাচ্ছে না। কিছুক্ষণ পরে আবার চেষ্টা করুন।\n\nত্রুটি: ' +
        (

          'Unknown AI error'
        )

    });

    saveAIChat();

      'NIVORA AI সংযোগে সমস্যা হয়েছে',
      'error'
    );

  } finally {

    aiBusy = false;

    NIVORA_NAV.renderCurrent();

    setTimeout(
      scrollAIChatBottom,
      50
    );

  }
}

    function calcAppend(val) {
      if (calcExpression === "0" && val !== '.') calcExpression = val;
      else calcExpression += val;
      updateCalcDisplay();
    }
    function calcClear() {
      calcExpression = "0";
      document.getElementById('calc-history').textContent = "";
      updateCalcDisplay();
    }
    function calcBackspace() {
      calcExpression = calcExpression.length > 1 ? calcExpression.slice(0, -1) : "0";
      updateCalcDisplay();
    }
    function calcCompute() {
      try {
        let res = eval(calcExpression.replace('×', '*').replace('÷', '/'));
        document.getElementById('calc-history').textContent = calcExpression + " =";
        calcExpression = String(res);
        updateCalcDisplay();
      } catch(e) {
        NIVORA_CORE.toast('ভুল হিসাব এক্সপ্রেশন', 'error');
      }
    }
    function updateCalcDisplay() {
      const disp = document.getElementById('calc-display');
      if (disp) disp.textContent = calcExpression;
    }

            <div><label class="text-slate-400">নগদ টাকা ও ব্যাংক জমার পরিমাণ</label><input type="number" id="zak-cash" class="w-full mt-1 bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-white" placeholder="0"></div>

            <button onclick="computeZakat()" class="w-full py-2.5 bg-emerald-600 text-white font-bold rounded-xl">যাকাত হিসাব করুন</button>
            <div id="zak-res" class="p-3 bg-slate-950 rounded-xl border border-slate-800 text-slate-300">প্রদেয় যাকাত: ৳ ০</div>

      } else if (tab === 'loan') {

      } else if (tab === 'bmi') {

    function computeBiz() {
      const cp = parseFloat(document.getElementById('biz-cp').value) || 0;
      const sp = parseFloat(document.getElementById('biz-sp').value) || 0;
      const diff = sp - cp;
      const pct = cp > 0 ? ((diff / cp) * 100).toFixed(2) : 0;
      document.getElementById('biz-res').innerHTML = `লাভ/ক্ষতি: <b>৳ ${diff}</b> (${pct}%)`;
    }
    function computeZakat() {
      const c = parseFloat(document.getElementById('zak-cash').value) || 0;
      const g = parseFloat(document.getElementById('zak-gold').value) || 0;
      const b = parseFloat(document.getElementById('zak-biz').value) || 0;
      const total = c + g + b;
      const zakat = total * 0.025;
      document.getElementById('zak-res').innerHTML = `মোট সম্পদ: ৳ ${total} <br>প্রদেয় যাকাত (২.৫%): <b class="text-emerald-400">৳ ${zakat.toFixed(2)}</b>`;
    }
    function computeLoan() {
      const p = parseFloat(document.getElementById('loan-amt').value) || 0;
      const r = (parseFloat(document.getElementById('loan-rate').value) || 0) / 12 / 100;
      const n = parseFloat(document.getElementById('loan-month').value) || 1;
      let emi = 0;
      if (r > 0) {
        emi = (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
      } else {
        emi = p / n;
      }
      document.getElementById('loan-res').innerHTML = `মাসিক কিস্তি (EMI): <b class="text-indigo-400">৳ ${emi.toFixed(2)}</b>`;
    }
    function computeAge() {
      const dobVal = document.getElementById('age-dob').value;
      if (!dobVal) return;
      const dob = new Date(dobVal);
      const diff = Date.now() - dob.getTime();
      const ageDate = new Date(diff);
      const years = Math.abs(ageDate.getUTCFullYear() - 1970);
      const months = ageDate.getUTCMonth();
      const days = ageDate.getUTCDate() - 1;
      document.getElementById('age-res').innerHTML = `বয়স: <b>${years} বছর, ${months} মাস, ${days} দিন</b>`;
    }
    function computeBMI() {
      const wt = parseFloat(document.getElementById('bmi-wt').value) || 0;
      const ht = (parseFloat(document.getElementById('bmi-ht').value) || 0) / 100;
      if (ht <= 0 || wt <= 0) return;
      const bmi = (wt / (ht * ht)).toFixed(2);
      let status = "স্বাভাবিক ওজন";
      if (bmi < 18.5) status = "কম ওজন (Underweight)";
      else if (bmi >= 25 && bmi < 30) status = "অতিরিক্ত ওজন (Overweight)";
      else if (bmi >= 30) status = "স্থূলতা (Obese)";
      document.getElementById('bmi-res').innerHTML = `BMI স্কোর: <b>${bmi}</b> (${status})`;
    }
    function calcP() {
      const c = parseFloat(document.getElementById('c-cost')?.value) || 0;
      const s = parseFloat(document.getElementById('c-sell')?.value) || 0;
      const p = s - c;
      const m = s > 0 ? (p/s)*100 : 0;
      document.getElementById('cp-res').textContent = NIVORA_CURRENCY.format(p);
      document.getElementById('cm-res').textContent = m.toFixed(2) + '%';
    }

    const NIVORA_UI = {
      openSearch() {
        const m = document.getElementById('search-modal');
        if (m) { m.classList.remove('hidden'); m.classList.add('flex'); document.getElementById('search-input')?.focus(); this.handleSearch(''); }
      },
      closeSearch() {
        const m = document.getElementById('search-modal');
        if (m) { m.classList.add('hidden'); m.classList.remove('flex'); }
      },
      handleSearch(q) {
        const list = [
          { id: 'quran', title: 'কুরআন হাব (Quran)' },
          { id: 'ai', title: 'নিভোরা এআই (AI)' },
          { id: 'business', title: 'ব্যবসা পরিচালনা (Business)' },
          { id: 'ledger', title: 'ডিজিটাল টালি খাতা (Ledger)' },
          { id: 'stock', title: 'স্টক ইনভেন্টরি (Stock)' },
          { id: 'market', title: 'মার্কেটপ্লেস (Market)' },
          { id: 'calculator', title: 'ক্যালকুলেটর (Calculator)' },
          { id: 'health', title: 'হোমিও হল (Homoeo)' },
          { id: 'tasks', title: 'টাস্ক ও ইনকাম (Tasks)' }
        ];
        const match = list.filter(x => x.title.toLowerCase().includes(q.toLowerCase()));
        const res = document.getElementById('search-results');
        if (res) {
          res.innerHTML = match.map(m => `
            <div onclick="NIVORA_UI.closeSearch(); NIVORA_NAV.goTo('${m.id}')" class="p-3 bg-slate-800 rounded-xl cursor-pointer hover:bg-slate-700 flex justify-between items-center text-xs">
              <span class="font-bold text-white">${m.title}</span><i class="fa-solid fa-chevron-right text-slate-500"></i>
            </div>
          `).join('');
        }
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      setInterval(() => {
        const now = new Date();
        const t = document.getElementById('live-time');
        const d = document.getElementById('live-date');
        if (t) t.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        if (d) d.textContent = now.toLocaleDateString('bn-BD', { weekday: 'short', month: 'short', day: 'numeric' });
      }, 1000);
      NIVORA_NAV.renderCurrent();
    });
