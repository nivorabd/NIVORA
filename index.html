
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#020617">
  <title>NIVORA ONE | AI & Business Management</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; }
    #workspace { height: calc(100dvh - 164px); min-height: 300px; }
    #appFrame { width: 100%; height: 100%; border: 0; background: #fff; }
    .feature-btn { transition: .2s ease; }
    .feature-btn.active {
      background: #059669;
      border-color: #10b981;
      color: #fff;
    }
    @media (max-width: 480px) {
      #workspace { height: calc(100dvh - 176px); }
    }
  </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 px-3 py-3">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">
      <button type="button" onclick="openFeature('ai')"
        class="flex items-center gap-2 text-left">
        <span class="w-10 h-10 rounded-xl bg-emerald-500 text-slate-950
          flex items-center justify-center text-xl">
          <i class="fa-solid fa-cube"></i>
        </span>
        <span>
          <span class="block font-bold text-lg tracking-wide">NIVORA ONE</span>
          <span class="block text-xs text-slate-400">AI & Business Platform</span>
        </span>
      </button>

      <div class="text-right">
        <div id="clock" class="text-xs sm:text-sm text-emerald-400">
          সময় লোড হচ্ছে...
        </div>
        <div class="text-xs text-slate-500 mt-1">Version 1.0</div>
      </div>
    </div>
  </header>

  <!-- Only two main features -->
  <nav class="bg-slate-900/70 border-b border-slate-800 p-3">
    <div class="max-w-7xl mx-auto grid grid-cols-2 gap-3">

      <button id="aiBtn" type="button"
        onclick="openFeature('ai')"
        class="feature-btn active border border-slate-700 rounded-xl
        p-3 text-sm font-semibold flex items-center justify-center gap-2">
        <i class="fa-solid fa-brain"></i>
        <span>NIVORA AI</span>
      </button>

      <button id="businessBtn" type="button"
        onclick="openFeature('business')"
        class="feature-btn border border-slate-700 bg-slate-950 rounded-xl
        p-3 text-sm font-semibold flex items-center justify-center gap-2">
        <i class="fa-solid fa-briefcase text-emerald-400"></i>
        <span>Business</span>
      </button>

    </div>
  </nav>

  <!-- Workspace heading -->
  <div class="px-3 py-2 bg-slate-950">
    <div class="max-w-7xl mx-auto flex justify-between items-center gap-2">
      <div>
        <h2 id="pageTitle" class="font-semibold text-sm">NIVORA AI</h2>
        <p id="pageDescription" class="text-xs text-slate-400 mt-1">
          আপনার বুদ্ধিমান ডিজিটাল সহকারী
        </p>
      </div>

      <button type="button" onclick="reloadFeature()"
        class="text-xs bg-slate-800 hover:bg-slate-700
        border border-slate-700 rounded-lg px-3 py-2">
        <i class="fa-solid fa-rotate-right mr-1"></i>
        রিফ্রেশ
      </button>
    </div>
  </div>

  <!-- Feature page -->
  <main id="workspace" class="flex-1 bg-white">
    <iframe
      id="appFrame"
      src="./ai-studio.html"
      title="NIVORA AI"
      loading="eager"
      allow="clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </main>

  <!-- Footer -->
  <footer class="bg-slate-900 border-t border-slate-800 px-3 py-2">
    <p class="text-center text-xs text-slate-400">
      NIVORA ONE · AI & Business Management
    </p>
  </footer>

  <script>
    "use strict";

    const FEATURES = {
      ai: {
        file: "./ai-studio.html",
        title: "NIVORA AI",
        description: "আপনার বুদ্ধিমান ডিজিটাল সহকারী",
        button: "aiBtn"
      },
      business: {
        file: "./business.html",
        title: "Business Management",
        description: "পণ্য, ক্রয়-বিক্রয় ও ব্যবসার হিসাব",
        button: "businessBtn"
      }
    };

    let currentFeature = "ai";

    function openFeature(name) {
      const feature = FEATURES[name];
      if (!feature) return;

      currentFeature = name;

      const frame = document.getElementById("appFrame");
      const title = document.getElementById("pageTitle");
      const description = document.getElementById("pageDescription");

      title.textContent = feature.title;
      description.textContent = feature.description;
      frame.title = feature.title;

      document.querySelectorAll(".feature-btn").forEach(button => {
        button.classList.remove("active");
      });

      document.getElementById(feature.button).classList.add("active");

      if (frame.getAttribute("src") !== feature.file) {
        frame.setAttribute("src", feature.file);
      }
    }

    function reloadFeature() {
      const frame = document.getElementById("appFrame");
      frame.src = FEATURES[currentFeature].file;
    }

    function updateClock() {
      const now = new Date();

      document.getElementById("clock").textContent =
        now.toLocaleString("bn-BD", {
          weekday: "short",
          day: "numeric",
          month: "short",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: true
        });
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>

</body>
</html>
